<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Library - Fables</title>
    <style>
        :root {
            --spotify-black: #000000;
            --spotify-base: #121212;
            --spotify-elevated: #1a1a1a;
            --spotify-highlight: #2a2a2a;
            --spotify-text-dim: #a7a7a7;
            --spotify-text-bright: #ffffff;
            --spotify-green: #1db954;
            --spotify-green-hover: #1ed760;
            --playlist-color: #4a6fa5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--spotify-black);
            color: var(--spotify-text-bright);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 240px;
            background-color: var(--spotify-black);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .sidebar h2 {
            font-size: 14px;
            color: var(--spotify-text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .nav-link {
            color: var(--spotify-text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--spotify-text-bright);
        }

        .nav-link.active {
            color: var(--spotify-text-bright);
        }

        .divider {
            height: 1px;
            background-color: #282828;
            margin: 10px 0 20px 0;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-view {
            flex: 1;
            background-color: var(--spotify-base);
            border-radius: 8px;
            margin: 8px 8px 98px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .playlist-header {
            padding: 40px 30px;
            display: flex;
            align-items: flex-end;
            background: linear-gradient(transparent 0, rgba(0,0,0,.5) 100%), var(--playlist-color);
        }

        .playlist-cover {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #2b4162 0%, #fa9c7a 100%);
            box-shadow: 0 4px 60px rgba(0,0,0,.5);
            margin-right: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .playlist-info p {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .playlist-info h1 {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .playlist-info .description {
            color: var(--spotify-text-dim);
            font-weight: normal;
            font-size: 14px;
        }

        .action-bar {
            padding: 24px 30px;
            background: linear-gradient(rgba(0,0,0,.6) 0, var(--spotify-base) 100%);
            display: flex;
            align-items: center;
        }

        .big-play-btn {
            width: 56px;
            height: 56px;
            background-color: var(--spotify-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 24px;
            padding-left: 5px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .big-play-btn:hover {
            background-color: var(--spotify-green-hover);
            transform: scale(1.05);
        }

        .track-list-container {
            padding: 0 30px 40px 30px;
        }

        .track-list-header {
            display: grid;
            grid-template-columns: 40px 1fr 150px;
            padding: 5px 16px;
            border-bottom: 1px solid #282828;
            color: var(--spotify-text-dim);
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .track-item {
            display: grid;
            grid-template-columns: 40px 1fr 150px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            color: var(--spotify-text-dim);
        }

        .track-item:hover {
            background-color: var(--spotify-highlight);
            color: var(--spotify-text-bright);
        }

        .track-item.playing {
            color: var(--spotify-green);
        }

        .track-item.playing .track-title {
            color: var(--spotify-green);
        }

        .track-number {
            font-variant-numeric: tabular-nums;
            font-size: 14px;
        }

        .track-item:hover .track-number {
            display: none;
        }
        .track-item:hover::before {
            content: "▶";
            width: 40px;
            color: var(--spotify-text-bright);
            font-size: 12px;
            display: block;
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            color: var(--spotify-text-bright);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 13px;
        }

        .track-album {
            font-size: 14px;
        }

        /* --- BOTTOM PLAYER --- */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: var(--spotify-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-top: 1px solid #282828;
            z-index: 100;
        }

        .now-playing-section {
            width: 30%;
            display: flex;
            align-items: center;
        }

        .now-playing-art {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2b4162 0%, #fa9c7a 100%);
            margin-right: 14px;
            border-radius: 4px;
        }

        .now-playing-info {
            display: flex;
            flex-direction: column;
        }

        .np-title {
            color: var(--spotify-text-bright);
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .np-artist {
            color: var(--spotify-text-dim);
            font-size: 12px;
        }

        .controls-section {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--spotify-text-dim);
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--spotify-text-bright);
        }

        .play-pause-btn {
            background-color: var(--spotify-text-bright);
            color: var(--spotify-black);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            padding-left: 3px;
        }
        
        .play-pause-btn.playing {
            padding-left: 0;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            color: var(--spotify-black);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            gap: 8px;
            font-size: 11px;
            color: var(--spotify-text-dim);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--spotify-text-bright);
            border-radius: 2px;
            width: 0%;
        }

        .progress-bar:hover .progress-fill {
            background-color: var(--spotify-green);
        }
        
        .right-section {
            width: 30%;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a class="nav-link active">Home</a>
        <a class="nav-link">Search</a>
        <a class="nav-link">Your Library</a>
        
        <div class="divider"></div>
        
        <h2>Playlists</h2>
        <a class="nav-link">Liked Lessons</a>
        <a class="nav-link">Module 1</a>
        <a class="nav-link">Module 2</a>
    </div>

    <!-- Main Content -->
    <div class="main-view">
        
        <!-- Header -->
        <div class="playlist-header">
            <div class="playlist-cover">📚</div>
            <div class="playlist-info">
                <p>Public Playlist</p>
                <h1>English Fables</h1>
                <div class="description">
                    A complete collection of 61 classic fables for listening practice.
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <button class="big-play-btn" id="main-play-btn">▶</button>
        </div>

        <!-- Track List -->
        <div class="track-list-container">
            <div class="track-list-header">
                <div>#</div>
                <div>Title</div>
                <div>Album</div>
            </div>
            
            <div id="track-container">
                <!-- Tracks injected here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="now-playing-section">
            <div class="now-playing-art" style="display: none;" id="np-art"></div>
            <div class="now-playing-info">
                <div class="np-title" id="now-playing-title"></div>
                <div class="np-artist" id="now-playing-artist"></div>
            </div>
        </div>
        
        <div class="controls-section">
            <div class="buttons">
                <button class="control-btn" id="prev-btn">⏮</button>
                <button class="control-btn play-pause-btn" id="play-pause-btn">▶</button>
                <button class="control-btn" id="next-btn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
        
        <div class="right-section"></div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // --- 1. TRACK DATA ---
        const tracks = [
            { title: "The Bat in the War", src: "The Bat in the War.wav" },
            { title: "The Bear and the Chipmunk", src: "The Bear and the Chipmunk.wav" },
            { title: "The Bear and the Two Friends", src: "The Bear and the Two Friends.wav" },
            { title: "The Boy and the Rattlesnake", src: "The Boy and the Rattlesnake.wav" },
            { title: "The Butterfly and the Kind Monk", src: "The Butterfly and the Kind Monk.wav" },
            { title: "The Camel and the Thistle", src: "The Camel and the Thistle.wav" },
            { title: "The Camel in the Tent", src: "The Camel in the Tent.wav" },
            { title: "The Cat and the Fox", src: "The Cat and the Fox.wav" },
            { title: "The Crow and the Peacock Feathers", src: "The Crow and the Peacock Feathers.wav" },
            { title: "The Deer and His Antlers", src: "The Deer and His Antlers.wav" },
            { title: "The Dog and His Reflection", src: "The Dog and His Reflection.wav" },
            { title: "The Dog and the Wolf", src: "The Dog and the Wolf.wav" },
            { title: "The Dog in the Manger", src: "The Dog in the Manger.wav" },
            { title: "The Donkey and the Lapdog", src: "The Donkey and the Lapdog.wav" },
            { title: "The Donkey and the Salt", src: "The Donkey and the Salt..wav" },
            { title: "The Eagle and the Arrow", src: "The Eagle and the Arrow..wav" },
            { title: "The Eagle and the Beetle", src: "The Eagle and the Beetle.wav" },
            { title: "The Eagle Who Thought He Was a Chicken", src: "The Eagle Who Thought He Was a Chicken.wav" },
            { title: "The Elephant and the Rope", src: "The Elephant and the Rope..wav" },
            { title: "The Falcon and the King", src: "The Falcon and the King..wav" },
            { title: "The Fox and the Stork", src: "The Fox and the Stork .wav" },
            { title: "The Fox and the Traitor Rooster", src: "The Fox and the Traitor Rooster.wav" },
            { title: "The Frogs Who Wanted a King", src: "The Frogs Who Wanted a King..wav" },
            { title: "The Goose and the Golden Eggs", src: "The Goose and the Golden Eggs..wav" },
            { title: "The Heron and the Fish", src: "The Heron and the Fish.wav" },
            { title: "The Horse and the Loaded Donkey", src: "The Horse and the Loaded Donkey.wav" },
            { title: "The Horse, the Stag, and the Rider", src: "The Horse, the Stag, and the Rider.wav" },
            { title: "The Lazy Swallow and the Winter", src: "The Lazy Swallow and the Winter..wav" },
            { title: "The Lion and the Clever Rabbit", src: "The Lion and the Clever Rabbit.wav" },
            { title: "The Lion and the Mouse", src: "The Lion and the Mouse..wav" },
            { title: "The Lion and the Painting", src: "The Lion and the Painting..wav" },
            { title: "The Lion, the Donkey, and the Fox", src: "The Lion, the Donkey, and the Fox.wav" },
            { title: "The Lions and the Divided Herd", src: "The Lions and the Divided Herd .wav" },
            { title: "The Little Bird and the Cow", src: "The Little Bird and the Cow..wav" },
            { title: "The Mice Who Wanted a Bell", src: "The Mice Who Wanted a Bell.wav" },
            { title: "The Monkey and the Crocodile", src: "The Monkey and the Crocodile.wav" },
            { title: "The Mouse, the Frog, and the Hawk", src: "The Mouse, the Frog, and the Hawk.wav" },
            { title: "The Nightingale and the Hawk", src: "The Nightingale and the Hawk.wav" },
            { title: "The Oak Tree and the Reed", src: "The Oak Tree and the Reed.wav" },
            { title: "The Old Dog and the Hole", src: "The Old Dog and the Hole .wav" },
            { title: "The Old Lion and the Footprints", src: "The Old Lion and the Footprints.wav" },
            { title: "The Old Man and the Scorpion", src: "The Old Man and the Scorpion .wav" },
            { title: "The Peacock and the Crane", src: "The Peacock and the Crane .wav" },
            { title: "The Peasant and the Snake", src: "The Peasant and the Snake.wav" },
            { title: "The Peasant Woman and the Mongoose", src: "The Peasant Woman and the Mongoose .wav" },
            { title: "The Scorpion and the Frog", src: "The Scorpion and the Frog.wav" },
            { title: "The Silent Elephant and the Noise", src: "The Silent Elephant and the Noise.wav" },
            { title: "The Snake and the Steel File", src: "The Snake and the Steel File .wav" },
            { title: "The Spider and the Flattered Fly", src: "The Spider and the Flattered Fly.wav" },
            { title: "The Tiger and the Smart Fox", src: "The Tiger and the Smart Fox .wav" },
            { title: "The Tiger and the Woodpecker", src: "The Tiger and the Woodpecker .wav" },
            { title: "The Turtle and the Scorpion", src: "The Turtle and the Scorpion..wav" },
            { title: "The Turtle and the Two Geese", src: "The Turtle and the Two Geese..wav" },
            { title: "The Two Dogs", src: "The Two Dogs..wav" },
            { title: "The Two Frogs and the Milk", src: "The Two Frogs and the Milk..wav" },
            { title: "The Two Roosters and the Eagle", src: "The Two Roosters and the Eagle ..wav" },
            { title: "The Two Seeds", src: "The Two Seeds..wav" },
            { title: "The Warrior and the Loyal Wolf", src: "The Warrior and the Loyal Wolf..wav" },
            { title: "The Wolf and the Lamb", src: "The Wolf and the Lamb..wav" },
            { title: "The Wolf in Sheep’s Clothing", src: "The Wolf in Sheep’s Clothing..wav" },
            { title: "The Woodcutter and the Trees", src: "The Woodcutter and the Trees..wav" }
        ];

        // --- 2. DOM ELEMENTS ---
        const trackContainer = document.getElementById('track-container');
        const audioPlayer = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const nowPlayingArtist = document.getElementById('now-playing-artist');
        const npArt = document.getElementById('np-art');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // --- 3. STATE ---
        let currentTrackIndex = null;
        let isPlaying = false;
        let delayTimeout = null; // Variable to hold our 3-second delay timer

        // --- 4. INITIALIZATION ---
        function renderTracks() {
            trackContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'track-item';
                
                if (index === currentTrackIndex && audioPlayer.src !== '') {
                    div.classList.add('playing');
                }
                
                div.innerHTML = `
                    <div class="track-number">${index + 1}</div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-artist">English Listening Practice</div>
                    </div>
                    <div class="track-album">61 Fables</div>
                `;
                div.onclick = () => playTrack(index);
                trackContainer.appendChild(div);
            });
        }

        // --- 5. AUDIO LOGIC ---
        function playTrack(index) {
            // Cancel the 3-second delay if the user manually clicks a new track
            if (delayTimeout) {
                clearTimeout(delayTimeout);
            }

            currentTrackIndex = index;
            const track = tracks[index];
            
            if (!audioPlayer.src.endsWith(encodeURI(track.src))) {
                audioPlayer.src = track.src;
                nowPlayingTitle.textContent = track.title;
                nowPlayingArtist.textContent = "Listening Practice";
                npArt.style.display = "block";
            }
            
            audioPlayer.play();
            isPlaying = true;
            updatePlayButtons(true);
            renderTracks();
        }

        function togglePlayPause() {
            if (!audioPlayer.src) {
                if (tracks.length > 0) playTrack(0);
                return;
            }
            
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                updatePlayButtons(false);
            } else {
                audioPlayer.play();
                isPlaying = true;
                updatePlayButtons(true);
            }
        }

        function updatePlayButtons(playing) {
            if (playing) {
                playPauseBtn.textContent = '⏸';
                playPauseBtn.classList.add('playing');
                mainPlayBtn.textContent = '⏸';
                mainPlayBtn.style.paddingLeft = '0';
            } else {
                playPauseBtn.textContent = '▶';
                playPauseBtn.classList.remove('playing');
                mainPlayBtn.textContent = '▶';
                mainPlayBtn.style.paddingLeft = '5px';
            }
        }

        function playNext() {
            if (currentTrackIndex !== null && currentTrackIndex < tracks.length - 1) {
                playTrack(currentTrackIndex + 1);
            }
        }

        function playPrev() {
            if (currentTrackIndex !== null && currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            } else if (audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
            }
        }

        // --- 6. EVENT LISTENERS ---
        playPauseBtn.addEventListener('click', togglePlayPause);
        mainPlayBtn.addEventListener('click', togglePlayPause);
        
        nextBtn.addEventListener('click', () => {
            if (delayTimeout) clearTimeout(delayTimeout);
            playNext();
        });
        
        prevBtn.addEventListener('click', () => {
            if (delayTimeout) clearTimeout(delayTimeout);
            playPrev();
        });

        // Trigger the 3-second delay when a track ends
        audioPlayer.addEventListener('ended', () => {
            delayTimeout = setTimeout(() => {
                playNext();
            }, 3000); // 3000 milliseconds = 3 seconds
        });

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('click', (e) => {
            if (!audioPlayer.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = pos * audioPlayer.duration;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Boot it up
        renderTracks();
    </script>
</body>
</html>
